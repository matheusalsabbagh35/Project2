<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Sensor Logger</title>
    <!-- Link the CSS file -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--header-->
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <h1>Greenhouse Sensor Logger</h1>
        </div>
        <div class="header-status">
          active Logs: <span id="queue-count" class="badge-count">0</span>
        </div>
      </div>
    </header>

    <!-- main section -->
    <main class="portal-container">
      <!-- Input form section -->
      <section id="sensor-entry" class="panel form-panel">
        <h2 class="panel-title">Record Sensor Reading</h2>

        <!-- Error message for invalid sensor input -->
        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          role="alert"
        ></div>

        <!-- Sensor input form-->
        <form action="#" id="sensor-form" novalidate>
          <div class="form-group">
            <label for="bay" class="form-label">
              Greenhouse Bay <span class="required">*</span>
            </label>
            <input
              type="text"
              id="bay"
              name="bay"
              class="form-control"
              placeholder="e.g. Bay A"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ph" class="form-label">
                pH Level <span class="required">*</span>
              </label>
              <input
                type="number"
                name="ph"
                id="ph"
                class="form-control"
                min="0"
                max="14"
                step="0.1"
                placeholder="7.0"
                required
              />
            </div>

            <div class="form-group">
              <label for="temp" class="form-label">
                Temperature (°F) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                min="-459.67"
                step="0.1"
                placeholder="75.0"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ec" class="form-label">
                Electrical Conductivity (mS/cm) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="ec"
                id="ec"
                class="form-control"
                min="0"
                step="0.1"
                placeholder="1.5"
                required
              />
            </div>

            <div class="form-group">
              <label for="humidity" class="form-label">
                Humidity (%) <span class="required">*</span>
              </label>
              <input
                type="number"
                name="humidity"
                id="humidity"
                class="form-control"
                min="0"
                max="100"
                step="0.1"
                placeholder="60.0"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Record Reading
          </button>
        </form>
      </section>

      <!-- Sensor log history section -->
      <section id="sensor-logs" class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">Sensor Log History</h2>
          <button
            id="clear-all"
            type="button"
            class="btn btn-outline-danger btn-sm"
          >
            Clear All
          </button>
        </div>

        <!-- Message when no sensor logs exist -->
        <div id="empty-state" class="empty-state">
          <p>No sensor readings logged.</p>
        </div>

        <!-- Dynamic sensor records -->
        <ul id="records-list" class="records-grid" aria-live="polite"></ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="portal-footer">
      <p>Greenhouse Sensor Logger</p>
    </footer>

    <!-- Connect JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
